name: Render Health Check (Manual)

# A daily Render Cron Job does not need an always-on web service or keep-alive pings.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
    steps:
      - name: Inspect web service health
        shell: bash
        run: |
          test -n "$SERVICE_URL" || { echo 'Set RENDER_SERVICE_URL'; exit 1; }
          case "$SERVICE_URL" in https://*) ;; *) echo 'Service URL must use HTTPS'; exit 1 ;; esac
          curl --fail --silent --show-error --connect-timeout 30 --max-time 120             --retry 3 --retry-delay 10 --retry-all-errors "${SERVICE_URL%/}/"
