name: Keep Render Service Alive

# Run every 30 minutes to prevent Render from sleeping
on:
  schedule:
    # Every 1 minute (GitHub Actions minimum)
    - cron: '* * * * *'
  
  workflow_dispatch:  # Manual trigger option

jobs:
  keep-alive:
    name: Keep Service Alive
    runs-on: ubuntu-latest
    
    steps:
      - name: Health Check
        run: |
          SERVICE_URL="https://daily-ai-news-merl.onrender.com"
          
          echo "🔄 Pinging health endpoint..."
          echo "URL: $SERVICE_URL/"
          
          # Try 2 times with longer timeout
          for attempt in 1 2; do
            echo "Attempt $attempt/2..."
            
            RESPONSE=$(curl -s -w '\n%{http_code}' -X GET "$SERVICE_URL/" \
              --connect-timeout 30 \
              --max-time 120 2>&1)
            
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            
            echo "Response Code: $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Service is alive!"
              exit 0
            else
              echo "⏳ Service not ready, retrying..."
              sleep 5
            fi
          done
          
          echo "⚠️ Service not responding after retries"
          exit 1
