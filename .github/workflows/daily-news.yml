name: Daily AI News Email

on:
  schedule:
    # Frequent UTC checks absorb delayed GitHub cron events.
    # The application holds delivery until 2:30 PM PKT (09:30 UTC).
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      scheduled:
        description: Respect the configured local delivery time
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-ai-news-delivery
  cancel-in-progress: false

jobs:
  send-news:
    if: github.event_name == 'workflow_dispatch' || vars.DAILY_NEWS_SCHEDULER != 'disabled'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LLM_PROVIDER: ollama
      LLM_BASE_URL: http://127.0.0.1:11434
      LLM_MODEL: ${{ vars.CLOUD_LLM_MODEL || 'qwen3:1.7b' }}
      LLM_TIMEOUT: '180'
      LLM_MAX_TOKENS: '160'
      LLM_TEMPERATURE: '0.3'
      SCHEDULE_TIME: '14:30'
      SCHEDULE_TIMEZONE: Asia/Karachi
      RESPECT_SCHEDULE: ${{ github.event_name == 'schedule' || inputs.scheduled }}
      SMTP_SERVER: ${{ vars.SMTP_SERVER || 'smtp.gmail.com' }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_CONTEXT_LENGTH: '2048'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check whether today's digest is due
        id: gate
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          import pytz
          from app.delivery_time import scheduled_delivery_target, delivery_identity
          from config.settings import SCHEDULE_TIME, SCHEDULE_TIMEZONE
          now = datetime.now(timezone.utc)
          date = now.astimezone(pytz.timezone(SCHEDULE_TIMEZONE)).date().isoformat()
          eligible = True
          if os.getenv('RESPECT_SCHEDULE') == 'true':
              try:
                  scheduled_delivery_target(SCHEDULE_TIME, SCHEDULE_TIMEZONE, now)
              except RuntimeError:
                  eligible = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'eligible={str(eligible).lower()}\n')
              for key, value in delivery_identity(date, SCHEDULE_TIME).items():
                  output.write(f'{key}={value}\n')
          print(f'Pakistan date: {date}; delivery due: {eligible}; target: {SCHEDULE_TIME}')
          PY
      - name: Restore today's delivery record
        if: steps.gate.outputs.eligible == 'true'
        id: delivery-cache
        uses: actions/cache/restore@v4
        with:
          path: .delivery-state
          key: ${{ steps.gate.outputs.cache_key }}
      - name: Skip a previously submitted digest
        if: steps.gate.outputs.eligible == 'true'
        id: ready
        env:
          DELIVERY_STATE_PATH: ${{ steps.gate.outputs.state_path }}
          DIGEST_DATE: ${{ steps.gate.outputs.date }}
        run: |
          python - <<'PY'
          import os
          from app.delivery_state import DeliveryState
          from config.settings import SCHEDULE_TIME
          state = DeliveryState(os.environ['DELIVERY_STATE_PATH'], os.environ['DIGEST_DATE'], SCHEDULE_TIME)
          send = state.can_send()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'send={str(send).lower()}\n')
          print('Digest needs delivery' if send else 'Already delivered today; skipping duplicate')
          PY
      - name: Validate private configuration
        if: steps.ready.outputs.send == 'true'
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python -c "from config.settings import validate_config; validate_config(); print('Configuration valid')"
      - name: Install and start Ollama on this cloud runner
        if: steps.ready.outputs.send == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export OLLAMA_MODELS="$RUNNER_TEMP/ollama-models"
          echo "OLLAMA_MODELS=$OLLAMA_MODELS" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            https://ollama.com/install.sh -o "$RUNNER_TEMP/install-ollama.sh"
          timeout 15m sh "$RUNNER_TEMP/install-ollama.sh"
          sudo systemctl stop ollama || true
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:11434/api/tags > /dev/null
      - name: Download the CPU-sized model
        if: steps.ready.outputs.send == 'true'
        run: timeout 15m ollama pull "$LLM_MODEL"
      - name: Check model, fetch news and send one email
        if: steps.ready.outputs.send == 'true'
        env:
          DELIVERY_STATE_PATH: ${{ steps.gate.outputs.state_path }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          python app/main.py --check-services
          if [ "$RESPECT_SCHEDULE" = true ]; then
            python app/main.py --run-once --scheduled
          else
            python app/main.py --run-once
          fi
      - name: Persist the delivery result, including an uncertain SMTP outcome
        if: always() && steps.ready.outputs.send == 'true' && hashFiles('.delivery-state/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .delivery-state
          key: ${{ steps.gate.outputs.cache_key }}
      - name: Record delivery status
        if: always()
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          import json, os
          now = datetime.now(ZoneInfo('Asia/Karachi'))
          records = [json.loads(p.read_text()) for p in Path('.delivery-state').glob('*.json')]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Checked at {now:%Y-%m-%d %H:%M:%S} Pakistan time.\n')
              summary.write(f'Daily target: {os.environ["SCHEDULE_TIME"]} Asia/Karachi.\n')
              summary.write(f'Delivery records: {records}\n')
          PY
