name: Daily AI News Trigger

on:
  schedule:
    # 17:00 UTC = 10 PM Pakistan time.
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-ai-news-delivery
  cancel-in-progress: false

jobs:
  trigger-news:
    # Use ONE scheduler. Leave this variable unset when using Render Cron.
    if: github.event_name == 'workflow_dispatch' || vars.DAILY_NEWS_SCHEDULER == 'github'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
      TRIGGER_TOKEN: ${{ secrets.TRIGGER_TOKEN }}
    steps:
      - name: Validate target and credentials
        shell: bash
        run: |
          test -n "$SERVICE_URL" || { echo 'Set RENDER_SERVICE_URL repository variable'; exit 1; }
          test -n "$TRIGGER_TOKEN" || { echo 'Set TRIGGER_TOKEN repository secret'; exit 1; }
          case "$SERVICE_URL" in https://*) ;; *) echo 'Service URL must use HTTPS'; exit 1 ;; esac
      - name: Wake service and check health
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 30 --max-time 120 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            "${SERVICE_URL%/}/" -o health.json
          python -c "import json; assert json.load(open('health.json')).get('status') == 'healthy'"
      - name: Send one digest
        shell: bash
        run: |
          # Do not retry delivery: a timed-out request may already have sent email.
          curl --fail --silent --show-error \
            --connect-timeout 30 --max-time 600 \
            -X POST "${SERVICE_URL%/}/trigger-news" \
            -H "Authorization: Bearer $TRIGGER_TOKEN" -o response.json
          python -c "import json; assert json.load(open('response.json')).get('status') == 'success'"
          echo 'Server reported successful SMTP submission. Verify inbox receipt.'
