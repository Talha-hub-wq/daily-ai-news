name: Daily AI News Trigger

on:
  # Daily schedule (UTC time)
  schedule:
    # 13:25 UTC = 6:25 PM Pakistan Time
    - cron: '25 13 * * *'

  # Manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  trigger-news:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Print current UTC time
      - name: Show Current Time
        run: |
          echo "Current UTC Time:"
          date -u

      # Wait a bit (helps Render cold start)
      - name: Initial Delay
        run: sleep 15

      # Trigger Render endpoint
      - name: Trigger Daily News Endpoint
        run: |
          SERVICE_URL="https://daily-ai-news-merl.onrender.com"

          echo "======================================"
          echo "Triggering Daily AI News Service"
          echo "URL: $SERVICE_URL/trigger-news"
          echo "======================================"

          SUCCESS=false

          for attempt in 1 2 3
          do
            echo ""
            echo "Attempt $attempt of 3"

            HTTP_CODE=$(curl -o response.txt -s -w "%{http_code}" \
              -X POST "$SERVICE_URL/trigger-news" \
              --connect-timeout 30 \
              --max-time 180 \
              -H "Content-Type: application/json")

            echo "HTTP Status: $HTTP_CODE"

            echo "Response:"
            cat response.txt

            if [ "$HTTP_CODE" = "200" ]; then
              echo ""
              echo "SUCCESS: Daily news triggered successfully!"
              SUCCESS=true
              break
            fi

            echo ""
            echo "Request failed. Waiting before retry..."
            sleep 20
          done

          if [ "$SUCCESS" = false ]; then
            echo ""
            echo "ERROR: Failed after 3 attempts"
            exit 1
          fi

      # Success log
      - name: Success Message
        if: success()
        run: |
          echo ""
          echo "======================================"
          echo "Daily AI News workflow completed!"
          echo "Check your email inbox."
          echo "======================================"

      # Failure log
      - name: Failure Message
        if: failure()
        run: |
          echo ""
          echo "======================================"
          echo "Workflow failed."
          echo "Check Render logs and GitHub Actions logs."
          echo "======================================"
