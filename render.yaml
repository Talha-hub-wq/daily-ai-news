# A cloud host needs a reachable, secured Ollama server; localhost on Render
# does not refer to your computer. This cron uses a paid compute plan for SMTP.
services:
  - type: cron
    name: daily-ai-news-digest
    branch: ollama-with-AI-News-Agent
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python app/main.py --run-once
    schedule: "0 17 * * *"  # 17:00 UTC = 22:00 Asia/Karachi
    envVars:
      - key: LLM_PROVIDER
        value: ollama
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        value: qwen3:8b
      - key: LLM_TIMEOUT
        value: "120"
      - key: LLM_MAX_TOKENS
        value: "160"
      - key: LLM_TEMPERATURE
        value: "0.3"
      - key: NEWSAPI_KEY
        sync: false
      - key: EMAIL_SENDER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_RECIPIENT
        sync: false
      - key: SCHEDULE_TIME
        value: "22:00"
      - key: SCHEDULE_TIMEZONE
        value: Asia/Karachi
      - key: SMTP_SERVER
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
