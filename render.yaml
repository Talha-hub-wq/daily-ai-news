# FREE web/status deployment. GitHub Actions runs Ollama and sends daily email.
# No SMTP credentials or local model host are needed by this status service.
services:
  - type: web
    name: daily-ai-news-status
    branch: ollama-with-AI-News-Agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app --workers 1 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: SCHEDULE_TIME
        value: "12:15"
      - key: SCHEDULE_TIMEZONE
        value: Asia/Karachi
      # Disable HTTP delivery/log access: the free web host is for status only.
      - key: TRIGGER_TOKEN
        value: ""
